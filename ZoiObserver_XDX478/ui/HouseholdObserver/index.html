<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>HouseholdObserver</title>
<link rel="stylesheet" href="coui://inzoi/mod/inzoi-fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* html/body MUST keep 'background: transparent' (game shows through; clicks outside the UI
   reach the game) and 'overflow: hidden'. NEVER set 'pointer-events: none' on html/body --
   it breaks inzoi.view.hover() / setHover() and leaks wheel/click input to the game camera. */
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
             font-family: var(--inzoi-font-ui); font-size: 22px; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
#app-root { position: relative; display: flex; flex-direction: column; overflow: hidden; }
#title-bar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
             padding: 4px 8px; background: rgba(0,0,0,0.7); color: #fff;
             user-select: none; -webkit-user-select: none; }
#title-text { font-size: 16px; font-weight: bold; }
#title-buttons { display: flex; align-items: center; gap: 6px; }
/* ASCII-only icons: _ for minimize, X for close.
   Buttons are visible by default; minimize-btn visibility controlled by scaffold (display:inline-block;). */
#minimize-btn, #close-btn {
    cursor: pointer; font-size: 14px; font-weight: bold; line-height: 1.4;
    font-family: var(--inzoi-font-mono, Consolas, monospace);
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; border-radius: 3px; padding: 1px 7px;
    user-select: none; -webkit-user-select: none; }
#minimize-btn:hover { background: rgba(255,255,255,0.28); }
#close-btn:hover    { background: rgba(200,60,60,0.5); }
#minimize-btn { display:inline-block; }
#content { flex: 1; min-height: 0; padding: 8px; overflow: auto; overscroll-behavior: contain; }
#app-root { position: absolute; top: 100px; left: 100px; }
#title-bar { cursor: move; }
#resize-handle { position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; opacity: 0.7; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.5) 41%, rgba(255,255,255,0.5) 55%, transparent 56%, transparent 68%, rgba(255,255,255,0.4) 69%, rgba(255,255,255,0.4) 80%, transparent 81%); }#resize-handle:hover { opacity: 1; }

</style>
<style id="observer-style">
#app-root { width: 520px; height: 650px; background: rgba(17,28,36,0.95); color:#eaf1f0; border:1px solid #4c7277; border-radius:8px; }
#content { padding:14px; font-size:17px; } .summary { border-bottom:1px solid #496369; padding-bottom:10px; }
p { margin:6px 0; line-height:1.45; } .buttons { display:flex; margin:12px 0; } button { background:#254951; border:1px solid #658d91; padding:7px 15px; border-radius:4px; margin-right:8px; cursor:pointer; font-size:17px; }
#start { background:#275e4c; } #stop { background:#65413f; } .help,.limit { font-size:13px; color:#b8cacd; }
.person { padding:10px 0; border-bottom:1px solid #3a5158; font-size:14px; } .person b { font-size:18px; }
.need { display:inline-block; background:#28424a; padding:4px; margin:2px; font-size:13px; } .urgent { background:#7e493b; } .intent { color:#e8f3c8; font-weight:bold; }
#log { height:140px; overflow-y:auto; margin-top:12px; padding:8px; background:#102027; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word; text-align:left; font-size:12px; font-family:var(--inzoi-font-mono); }
</style></head>
<body>
<div id="app-root">
  <div id="title-bar">
    <span id="title-text">Zoi Observer 0.6.13</span>
    <div id="title-buttons">
      <span id="minimize-btn" title="창만 접기 · 자동 관리는 계속됩니다">숨기기</span>
      <span id="close-btn">X</span>
    </div>
  </div>
  <div id="content">
  </div>
</div>
<!-- ===================================================================
     REQUIRED SCRIPTS -- DO NOT REMOVE OR REORDER.
     If you rewrite this file, these four <script> tags MUST stay, in order:
       1. coui://inzoi/cohtml.js        -> engine (game bridge; input forwarding)
       2. coui://inzoi/mod/inzoi-sdk.js -> inzoi.* (view.hover, cli, saveState...)
       3. window.js                     -> scaffold window mgr; defines the wf global
       4. app.js                        -> your mod logic (uses wf)
     Dropping #1 or #2 silently breaks input/hover: the game stops receiving
     clicks outside the UI and inzoi.* APIs throw. window.js logs a loud error
     if either is missing (see its dependency guard).
     ==================================================================== -->
<script src="coui://inzoi/cohtml.js"></script>
<script src="coui://inzoi/mod/inzoi-sdk.js"></script>
<script src="window.js"></script>
<script src="policy.js"></script>
<script src="protocol.js"></script>
<script src="life.js"></script>
<script src="child-care.js"></script>
<script src="game-data.js"></script>
<script src="goal-memory.js"></script>
<script src="scoreboard.js"></script>
<script src="agenda.js"></script>
<script src="recovery.js"></script>
<script src="career-path.js"></script>
<script src="persona.js"></script>
<script src="why.js"></script>
<script src="duty.js"></script>
<script src="family.js"></script>
<script src="rotation.js"></script>
<script src="fieldcheck.js"></script>
<script src="relations.js"></script>
<script src="gathering.js"></script>
<script src="choices.js"></script>
<script src="life-actions.js"></script>
<script src="panels.js"></script>
<script src="travel.js"></script>
<script src="app.js"></script>
<script src="devprobe.js"></script>
</body>
</html>
